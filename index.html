<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COMPANION IA</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- EL REGRESO DEL HALO ANIMADO NEÓN --- */
        .neon-logo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* El círculo neón que prende, apaga y cambia de lugar girando */
        .neon-halo {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px #bc00dd, inset 0 0 15px #bc00dd;
            border: 3px solid transparent;
            border-top: 3px solid #bc00dd; /* El halo brillante */
            animation: haloGiro 4s linear infinite, haloPulso 2s ease-in-out infinite alternate;
            z-index: 1;
        }
        .avatar-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            z-index: 2;
            object-fit: cover;
            border: 2px solid #0d0c1d;
        }
        @keyframes haloGiro {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes haloPulso {
            0% { opacity: 0.3; filter: drop-shadow(0 0 2px #bc00dd); }
            100% { opacity: 1; filter: drop-shadow(0 0 15px #bc00dd); }
        }

        /* Control de la barra de búsqueda controlada por la lupa */
        .search-container {
            display: none;
            padding: 12px 16px;
            background: #0d0c1d;
            border-bottom: 2px solid #a855f7;
        }
        .search-container.active { display: block; }
        .search-box {
            width: 100%; background: #1a1636; border: 1px solid #bc00dd;
            border-radius: 8px; color: #fff; padding: 12px; font-size: 14px;
            outline: none; box-sizing: border-box;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
        .btn-save-neon { background: #bc00dd; color: white; }
        .btn-close-dark { background: #323130; color: #e2e1e9; }
    </style>
</head>
<body>

    <div id="app-wrapper" data-modo="home">
        
        <!-- Encabezado con tu Logo Animado Dinámico -->
        <header class="app-header" style="background: #0d0c1d; padding: 16px; text-align: center;">
            <div class="neon-logo-wrapper">
                <div class="neon-halo"></div>
                <img src="./icon.png" class="avatar-img" onerror="this.src='https://placeholder.com';">
            </div>
            <h1 style="color: #fff; font-size: 26px; margin: 0; font-weight: 800; letter-spacing: 1px;">COMPANION IA</h1>
            <p style="color: #a855f7; font-size: 12px; margin: 4px 0; font-weight: 600;">by MASTER S</p>
            <p style="color: #6c5ce7; font-size: 10px; font-family: monospace;">LIVE UPDATE TERMUX MODE</p>
        </header>

        <div id="dynamicSearchContainer" class="search-container">
            <input type="text" id="searchBarInput" class="search-box hidden" placeholder="Buscar personaje..." oninput="filtrarPersonajesLocal()">
        </div>

        <main class="main-content" style="padding: 16px; height: calc(100vh - 300px); overflow-y: auto; box-sizing: border-box;">
            
            <!-- Vista 1: Home -->
            <div class="view-panel" id="panel-home">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="color: white; font-size: 22px; margin: 0;">Tus Personajes</h2>
                    <button onclick="cambiarPanel('crear')" style="background: #bc00dd; color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: bold;">+ Crear</button>
                </div>
                <div id="characters-list"></div>
                <div id="no-characters-fallback" style="text-align: center; color: #a855f7; margin-top: 40px;">
                    <p>Sin personajes</p><small>Toca + Crear para empezar</small>
                </div>
            </div>

            <!-- Vista 2: Crear Personaje +18 -->
            <div class="view-panel" id="panel-crear" style="display:none; background: #131129; border: 2px solid #bc00dd; border-radius: 16px; padding: 20px; box-sizing: border-box;">
                <h2 style="color: white; font-size: 20px; margin-top: 0; margin-bottom: 15px;">Nuevo Personaje +18</h2>
                
                <label style="color: #a855f7; font-size: 12px; display: block; margin-bottom: 6px;">Nombre</label>
                <input type="text" id="char-name" style="width:100%; background:#0d0c1d; border:1px solid #a855f7; padding:12px; border-radius:8px; color:white; margin-bottom:14px; box-sizing:border-box;">
                
                <label style="color: #a855f7; font-size: 12px; display: block; margin-bottom: 6px;">Personalidad (ej: coqueta, dominante, tímida... ADULTO)</label>
                <textarea id="char-prompt" style="width:100%; background:#0d0c1d; border:1px solid #a855f7; padding:12px; border-radius:8px; color:white; height: 100px; margin-bottom:14px; box-sizing:border-box;"></textarea>
                
                <label style="color: #a855f7; font-size: 12px; display: block; margin-bottom: 6px;">Saludo inicial</label>
                <input type="text" id="char-saludo" style="width:100%; background:#0d0c1d; border:1px solid #a855f7; padding:12px; border-radius:8px; color:white; margin-bottom:14px; box-sizing:border-box;">
                
                <div class="modal-buttons">
                    <button onclick="cambiarPanel('home')" class="btn-close-dark">Cancelar</button>
                    <button onclick="guardarNuevoPersonaje()" class="btn-save-neon">Guardar</button>
                </div>
            </div>

            <!-- Vista 3: Sala de Chat -->
            <div class="view-panel" id="panel-chat" style="display:none;">
                <div style="display: flex; align-items: center; background: #131129; padding: 10px; border-radius: 12px; border: 1px solid #bc00dd; margin-bottom: 12px;">
                    <button onclick="cambiarPanel('home')" style="background: none; border: none; color: #bc00dd; font-size: 18px; font-weight: bold; padding-right:15px;">←</button>
                    <div>
                        <h3 id="active-chat-name" style="color: white; margin: 0; font-size: 16px;">IA Companion</h3>
                        <small id="active-chat-status" style="color: #00ff66; font-size: 12px;">Generado por IA</small>
                    </div>
                </div>
                <div id="chat-messages-box" style="height: calc(100vh - 410px); overflow-y: auto; padding: 8px; background: #0d0c1d; border-radius: 8px; border: 1px solid rgba(168,85,247,0.2); box-sizing: border-box;"></div>
                <div style="display: flex; gap: 8px; margin-top: 10px; box-sizing: border-box;">
                    <input type="text" id="chat-user-message" style="flex:1; background:#131129; border:1px solid #a855f7; padding:12px; border-radius:8px; color:white;" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') enviarMensajeAOllama()">
                    <button onclick="enviarMensajeAOllama()" style="background:#bc00dd; border:none; color:white; width:46px; height:46px; border-radius:8px;">▶</button>
                </div>
            </div>

            <!-- Vista 4: Panel Yo -->
            <div class="view-panel" id="panel-yo" style="display:none; background: #131129; padding: 16px; border-radius: 12px; border: 1px solid rgba(168,85,247,0.3);">
                <h3 style="color: white; margin: 0 0 12px 0;">👤 PERFIL</h3>
                <input type="text" id="user-profile-name" style="width:100%; background:#0d0c1d; border:1px solid #a855f7; padding:10px; border-radius:6px; color:white; box-sizing:border-box; margin-bottom:12px;" value="Master S">
                <button onclick="formatearBaseDeDatosCompleta()" style="background:#fde7e9; color:#a80000; border:1px solid #f3b1b3; padding:10px; border-radius:8px; font-weight:bold; width:100%;">Borrar todos los datos</button>
                <div style="margin-top:15px; color:#fff; font-size:13px;">
                    <p>Personajes: <strong id="stat-chars" style="color:#bc00dd;">0</strong></p>
                    <p>Chats: <strong id="stat-chats" style="color:#bc00dd;">0</strong></p>
                </div>
            </div>

        </main>

        <!-- Menú de Navegación Fijo Inferior -->
        <footer class="app-nav-bar" style="height: 65px; background: #131129; border-top: 1px solid #bc00dd; display: flex; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999;">
            <button id="nav-home" style="flex:1; background:none; border:none; color:#a855f7; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px;" onclick="cambiarPanel('home')">🏠<br>Home</button>
            <button id="nav-buscar" style="flex:1; background:none; border:none; color:#a855f7; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px;" onclick="alternarBarraBusqueda()">🔍<br>Buscar</button>
            <button id="nav-crear" style="flex:1; background:none; border:none; color:#a855f7; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px;" onclick="cambiarPanel('crear')">➕<br>Crear</button>
