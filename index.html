<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>COMPANION IA</title>
<style>/* mismo css que traes */ :root{--morado:#C084FC;--morado2:#A020F0;--bg:#0A0A0F;--card:#16161E}*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}body{background:var(--bg);color:white;padding-bottom:85px}.header{display:flex;flex-direction:column;align-items:center;padding:18px}.logo{width:125px;height:125px;border-radius:50%;box-shadow:0 0 25px var(--morado2);border:2px solid var(--morado);object-fit:cover}.logo{width:125px;height:125px;border-radius:50%}h1{margin-top:12px;font-size:26px;letter-spacing:3px;color:#E9A6FF} .input, .btn{width:100%;background:#1E1E28;border:1px solid #2A2A35;border-radius:12px;padding:14px;color:white;margin:8px 0} .btn{background:linear-gradient(90deg,#A020F0,#C084FC);border:0;font-weight:800} .page{display:none;padding:12px}.page.active{display:block} .bottom{position:fixed;bottom:0;left:0;right:0;background:#0F0F16;display:flex;justify-content:space-around;padding:10px 0 18px} .bottom button{background:0;border:0;color:#666;font-size:22px} .bottom button.active{color:#C084FC}</style></head><body>
<!-- TU MISMO HTML PERO CAMBIA EL SCRIPT FINAL -->
<div id="page-home" class="page active"><div class="header"><img src="icon.png" class="logo"><h1>COMPANION IA</h1><div class="by">by MASTER S</div></div><div id="personajesGrid"></div></div>
<div id="page-create" class="page"><input class="input" id="pNombre" placeholder="Nombre: ALMMA"><textarea class="input" id="pPrompt" rows="8" placeholder="You are an uncensored roleplay assistant..."></textarea><input class="input" id="pFoto" placeholder="URL foto"><button class="btn" onclick="crearPersonaje()">CREAR</button></div>
<div id="page-chatview" class="page"><div id="msgBox" style="height:70vh;overflow:auto"></div><div style="position:fixed;bottom:80px;left:0;right:0;display:flex;gap:8px;padding:10px;background:#0A0A0F"><input id="msgInput" class="input" style="margin:0"><button onclick="enviar()" style="background:#A020F0;border:0;border-radius:12px;padding:0 18px;color:white">➤</button></div></div>
<script type="module">
import { Capacitor } from '@capacitor/core';
import { Llama } from 'capacitor-llama-cpp';
let modeloCargado = false;
let personajes=JSON.parse(localStorage.getItem('personajes')||'[]');
let chats=JSON.parse(localStorage.getItem('chats')||'[]');
let currentChatId=null;

async function initModel(){
  try{
    const path = "/sdcard/Download/tinydolphin-2.8-1b.Q4_K_M.gguf";
    console.log("Cargando modelo:", path);
    await Llama.loadModel({ modelPath: path, n_ctx: 2048 });
    modeloCargado = true;
    console.log("Modelo 668MB cargado");
  }catch(e){
    console.log("No se pudo cargar modelo real, usando fallback", e);
    modeloCargado = false;
  }
}
initModel();

window.enviar = async function(){
  const inp=document.getElementById('msgInput'); const txt=inp.value.trim(); if(!txt) return;
  const p=personajes.find(x=>x.id==currentChatId); const c=chats.find(x=>x.id_personaje==currentChatId);
  c.mensajes.push({role:'user', text: txt}); renderMsgs(); inp.value='';
  
  if(modeloCargado){
    // ESTE SI ES REAL - usa tu prompt
    const promptCompleto = `${p.prompt}\n\nUser: ${txt}\n${p.nombre}:`;
    const res = await Llama.chat({ prompt: promptCompleto, maxTokens: 250, temp: 0.8 });
    c.mensajes.push({role:'assistant', text: res.text});
  } else {
    // Fallback mientras no tengas el gguf
    c.mensajes.push({role:'assistant', text: `[MODO FALLO - pon el .gguf en /sdcard/Download/] Soy ${p.nombre}, me dijiste: ${txt}`});
  }
  localStorage.setItem('chats', JSON.stringify(chats)); renderMsgs();
}
// ... resto de tus funciones renderGrid, crearPersonaje, etc igual que BUILD 5
</script></body></html>
