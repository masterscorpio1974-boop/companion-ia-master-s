<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion IA</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>COMPANION IA</h1><p>By Master S - OFFGRID MORADA</p></header>
<main><div class="top"><h2>Tus Personajes</h2><button id="btnCrear" onclick="document.getElementById('modal').style.display='flex'">+ Crear</button></div><div id="lista"></div></main>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:99"><div style="background:#1a132a;width:90%;max-width:380px;padding:20px;border-radius:16px;border:2px solid #9d00ff"><h3 style="margin:0 0 10px;color:#d88cff">Nuevo Personaje</h3><input id="cNombre" placeholder="Nombre Ej: Luna" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#0f0a1a;color:#fff"><textarea id="cDesc" placeholder="Personalidad: timida, ruda, coqueta..." style="width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#0f0a1a;color:#fff;height:80px"></textarea><textarea id="cSaludo" placeholder="Primer mensaje: Hola soy..." style="width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#0f0a1a;color:#fff;height:60px"></textarea><div style="display:flex;gap:10px;margin-top:10px"><button onclick="document.getElementById('modal').style.display='none'" style="flex:1;padding:12px;background:#333;border:0;border-radius:8px;color:#fff">Cancelar</button><button id="cSave" style="flex:1;padding:12px;background:#9d00ff;border:0;border-radius:8px;color:#fff;font-weight:700">Guardar</button></div></div></div>
<div id="chat" style="display:none;position:fixed;inset:0;background:#0a0a0f;flex-direction:column;z-index:100"><div style="background:#120a1f;padding:14px;display:flex;gap:10px;border-bottom:2px solid #9d00ff"><button id="bVolver" style="background:#333;border:0;color:#fff;padding:8px 12px;border-radius:8px">← Volver</button><b id="chatNombre" style="color:#d88cff"></b></div><div id="msgs" style="flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px"></div><div style="display:flex;gap:8px;padding:12px;border-top:1px solid #222"><input id="inp" placeholder="Escribe..." style="flex:1;padding:12px;border-radius:8px;border:1px solid #333;background:#111;color:#fff"><button id="btnSend" style="padding:12px 16px;background:#9d00ff;border:0;border-radius:8px;color:#fff">Enviar</button></div></div>
<script src="logic.js"></script>
</body></html>
