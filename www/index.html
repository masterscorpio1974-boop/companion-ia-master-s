<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>COMPANION IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0c1d;color:#fff;font-family:sans-serif}
#app-wrapper{padding-bottom:110px;min-height:100vh}
.app-header{text-align:center;padding:25px 15px 15px;border-bottom:1px solid rgba(188,0,221,0.3)}
.neon-logo-wrapper{position:relative;width:110px;height:110px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.neon-halo{position:absolute;width:110px;height:110px;border-radius:50%;border-top:2px solid #bc00dd;box-shadow:0 0 20px #bc00dd;animation:haloGiro 3s linear infinite}
.avatar-img{width:85px;height:85px;border-radius:50%;object-fit:cover;z-index:2}
.main-title{font-size:26px;font-weight:900}
.author-tag{color:#a855f7;font-size:11px}
.live-tag{font-size:11px;font-family:monospace;margin-top:4px;font-weight:bold}
.main-content{padding:16px}
.view-panel{display:none}.view-panel.active{display:block}
.character-card{background:#131129;border:1px solid rgba(188,0,221,0.5);padding:14px;border-radius:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer}
.character-card img{width:40px;height:40px;border-radius:50%}
.form-input,.form-textarea{width:100%;background:#0d0c1d;border:1px solid #a855f7;padding:12px;border-radius:8px;color:#fff;margin-bottom:12px}
.modal-buttons{display:flex;gap:10px}.modal-buttons button{flex:1;padding:12px;border-radius:8px;font-weight:bold;border:none;cursor:pointer}
.btn-save{background:#bc00dd;color:#fff}.btn-cancel{background:#323130;color:#fff}
#chat-messages-box{height:calc(100vh - 260px);overflow-y:auto;padding:8px;background:#0a0914;border-radius:12px;margin:10px 0}
.app-nav-bar{position:fixed;bottom:0;left:0;width:100%;height:85px;background:#131129;border-top:2px solid #bc00dd;display:flex;z-index:999}
.nav-item{flex:1;background:#131129;border:none;color:#a855f7;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.nav-item.active{color:#bc00dd}
.img-preview{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #bc00dd;display:none;margin-bottom:10px}
@keyframes haloGiro{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app-wrapper">
<header class="app-header">
<div class="neon-logo-wrapper"><div class="neon-halo"></div><img src="icon.png" class="avatar-img" onerror="this.style.display='none'"></div>
<h1 class="main-title">COMPANION IA</h1>
<span class="author-tag">by MASTER S</span>
<p class="live-tag" id="live-status" style="color:#ff0040">• CHECANDO...</p>
</header>
<main class="main-content">
<div class="view-panel active" id="panel-home"><h2>Tus Personajes</h2><div id="characters-list"></div><div id="no-characters-fallback" style="text-align:center;color:#a855f7;margin-top:40px;display:none">No tienes personajes aún</div></div>
<div class="view-panel" id="panel-chats"><h2>Chats</h2><div id="chats-list"></div></div>
<div class="view-panel" id="panel-crear"><h2>Nuevo Personaje</h2>
<input type="file" id="char-img-file" accept="image/*" style="display:none" onchange="previewImagen(event)">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><img id="char-img-preview" class="img-preview"><button type="button" onclick="document.getElementById('char-img-file').click()" style="background:#1a1636;border:1px dashed #a855f7;color:#a855f7;padding:8px 12px;border-radius:8px;cursor:pointer">📷 Foto</button></div>
<input type="text" id="char-name" class="form-input" placeholder="Nombre del personaje...">
<input type="text" id="char-model" class="form-input" placeholder="Modelo Ollama" value="qwen2.5:7b-instruct-q4_K_M">
<textarea id="char-prompt" class="form-textarea" placeholder="Prompt del personaje (rol que debe seguir)..." rows="4"></textarea>
<textarea id="char-saludo" class="form-textarea" placeholder="Saludo inicial..." rows="2"></textarea>
<div class="modal-buttons"><button type="button" class="btn-save" onclick="guardarNuevoPersonaje()">Guardar</button><button type="button" class="btn-cancel" onclick="cambiarPanel('home')">Cancelar</button></div>
<p style="font-size:10px;color:#666;margin-top:8px">Modelos: qwen2.5:7b-instruct-q4_K_M (factual) / dolphin-llama3:8b (hacking)</p>
</div>
<div class="view-panel" id="panel-chat"><div style="display:flex;align-items:center;gap:10px;background:#131129;padding:10px;border-radius:10px;margin-bottom:10px"><button type="button" onclick="cambiarPanel('chats')" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer">←</button><h3 id="active-chat-name" style="flex:1">Chat</h3><small id="active-chat-status" style="color:#00ff66">En línea</small></div><div id="chat-messages-box"></div><div style="display:flex;gap:8px"><input type="text" id="chat-user-message" class="form-input" placeholder="Escribe..." style="margin-bottom:0" onkeypress="if(event.key==='Enter') enviarMensajeAOllama()"><button type="button" onclick="enviarMensajeAOllama()" style="background:#bc00dd;border:none;border-radius:8px;padding:0 18px;color:#fff;font-size:20px">➤</button></div></div>
<div class="view-panel" id="panel-yo"><h3>👤 MI PERFIL - OFFGRID</h3><label style="font-size:12px;color:#a855f7">Tu nombre</label><input type="text" id="user-profile-name" class="form-input" placeholder="Master S"><label style="font-size:12px;color:#a855f7;margin-top:8px;display:block">IP Ollama</label><input type="text" id="ollama-url-input" class="form-input" value="http://127.0.0.1:11434"><div id="config-saved" style="display:none;color:#00ff66;font-size:12px;margin-bottom:8px">✅ Guardado</div><button type="button" class="btn-save" style="width:100%;padding:12px;border-radius:8px;border:2px solid #00ff66;background:transparent;color:#00ff66" onclick="guardarConfig()">💾 Guardar IP</button><button type="button" onclick="formatearBaseDeDatosCompleta()" style="width:100%;margin-top:20px;padding:12px;border-radius:10px;border:none;background:#ffe1e1;color:#900;font-weight:bold">Borrar todo</button></div>
</main>
</div>
<footer class="app-nav-bar">
<button type="button" id="nav-home" class="nav-item active" onclick="cambiarPanel('home')">🏠<br>Home</button>
<button type="button" id="nav-chats" class="nav-item" onclick="cambiarPanel('chats');renderizarChats()">💬<br>Chats</button>
<button type="button" id="nav-crear" class="nav-item" onclick="cambiarPanel('crear')">➕<br>Crear</button>
<button type="button" id="nav-yo" class="nav-item" onclick="cambiarPanel('yo')">👤<br>Yo</button>
</footer>
<script>
let COMPANION_STORAGE = JSON.parse(localStorage.getItem('COMPANION_DB')) || {config:{userName:"Master S",ollamaUrl:"http://127.0.0.1:11434"},characters:[],history:{}};
let personajeActivoId = null;
let tempImgBase64 = "";
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('user-profile-name').value=COMPANION_STORAGE.config.userName;document.getElementById('ollama-url-input').value=COMPANION_STORAGE.config.ollamaUrl;renderizarListaPersonajes();checarConexionReal();setInterval(checarConexionReal,3000);});
function getBaseUrl(){let url=(COMPANION_STORAGE.config.ollamaUrl||"").trim();url=url.replace(/\/api\/generate.*$/,"").replace(/\/$/,"");if(url&&!url.startsWith("http"))url="http://"+url;if(!url)url="http://127.0.0.1:11434";return url;}
  async function checarConexionReal(){
  const el=document.getElementById('live-status');
  const base=getBaseUrl();
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),4000); // ⏰ subimos a 4 segundos
    const r=await fetch(`${base}/api/tags`,{method:'GET',signal:ctrl.signal});
    clearTimeout(t);
    if(r && r.ok){
      el.innerHTML='✅ • OFFGRID • CONECTADO';
      el.style.color='#00ff66';
    }else throw new Error('Respuesta mala');
  }catch(e){
    el.innerHTML='⚠️ • CONECTANDO... PRENDE/REVISA TERMUX';
    el.style.color='#ffaa00';
  }
}

function previewImagen(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(ev){tempImgBase64=ev.target.result;const prev=document.getElementById('char-img-preview');prev.src=tempImgBase64;prev.style.display='block';};reader.readAsDataURL(file);}
function cambiarPanel(nombre){document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));const panel=document.getElementById('panel-'+nombre);if(panel)panel.classList.add('active');const btn=document.getElementById('nav-'+nombre);if(btn)btn.classList.add('active');}
function guardarConfig(){COMPANION_STORAGE.config.userName=document.getElementById('user-profile-name').value.trim()||"Master S";let raw=document.getElementById('ollama-url-input').value.trim();raw=raw.replace(/\/api\/generate.*$/,"").replace(/\/$/,"");if(raw&&!raw.startsWith("http"))raw="http://"+raw;if(!raw)raw="http://127.0.0.1:11434";COMPANION_STORAGE.config.ollamaUrl=raw;document.getElementById('ollama-url-input').value=raw;localStorage.setItem('COMPANION_DB',JSON.stringify(COMPANION_STORAGE));const msg=document.getElementById('config-saved');msg.style.display='block';setTimeout(()=>msg.style.display='none',1500);checarConexionReal();}
function guardarNuevoPersonaje(){const nameInp=document.getElementById('char-name').value.trim();const modelInp=document.getElementById('char-model').value.trim()||"qwen2.5:7b-instruct-q4_K_M";const promptInp=document.getElementById('char-prompt').value.trim();const saludoInp=document.getElementById('char-saludo').value.trim();if(!nameInp||!promptInp){alert('Falta nombre o prompt');return;}const nuevo={id:'char_'+Date.now(),name:nameInp,model:modelInp,prompt:promptInp,saludo:saludoInp||("Hola, soy "+nameInp),img:tempImgBase64};COMPANION_STORAGE.characters.push(nuevo);COMPANION_STORAGE.history[nuevo.id]=[{role:'model',text:nuevo.saludo}];localStorage.setItem('COMPANION_DB',JSON.stringify(COMPANION_STORAGE));tempImgBase64="";document.getElementById('char-img-preview').style.display='none';document.getElementById('char-name').value="";document.getElementById('char-model').value="qwen2.5:7b-instruct-q4_K_M";document.getElementById('char-prompt').value="";document.getElementById('char-saludo').value="";renderizarListaPersonajes();cambiarPanel('home');}
function renderizarListaPersonajes(){const lista=document.getElementById('characters-list');if(!lista)return;lista.innerHTML='';document.getElementById('no-characters-fallback').style.display=COMPANION_STORAGE.characters.length==0?'block':'none';COMPANION_STORAGE.characters.forEach(char=>{let card=document.createElement('div');card.className='character-card';card.setAttribute('data-name',char.name);const imgTag=char.img?`<img src="${char.img}">`:`<div style="font-size:20px;background:rgba(188,0,221,0.15);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center">👤</div>`;const modelLabel=char.model||'qwen2.5';card.innerHTML=`${imgTag}<div style="flex:1"><h4>${char.name}</h4><small style="color:#a855f7;font-size:11px">${modelLabel}</small></div>`;card.onclick=()=>abrirSalaChat(char.id);lista.appendChild(card);});}
function renderizarChats(){const lista=document.getElementById('chats-list');if(!lista)return;lista.innerHTML='';COMPANION_STORAGE.characters.forEach(char=>{const hist=COMPANION_STORAGE.history[char.id]||[];if(hist.length<=1)return;const last=hist[hist.length-1].text||"";let card=document.createElement('div');card.className='character-card';const imgTag=char.img?`<img src="${char.img}">`:`<div style="font-size:20px;background:rgba(188,0,221,0.15);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center">👤</div>`;card.innerHTML=`${imgTag}<div style="flex:1"><h4>${char.name}</h4><small style="color:#888;font-size:11px">${last.substring(0,40)}</small></div>`;card.onclick=()=>abrirSalaChat(char.id);lista.appendChild(card);});if(lista.innerHTML==="")lista.innerHTML=`<p style="text-align:center;color:#a855f7;margin-top:30px">Sin chats aún</p>`;}
function abrirSalaChat(charId){personajeActivoId=charId;const char=COMPANION_STORAGE.characters.find(c=>c.id==charId);if(!char)return;document.getElementById('active-chat-name').innerText=char.name;document.getElementById('active-chat-status').innerText=char.model||'';cambiarPanel('chat');refrescarHistorialPantallaChat();}
function refrescarHistorialPantallaChat(){const caja=document.getElementById('chat-messages-box');caja.innerHTML='';(COMPANION_STORAGE.history[personajeActivoId]||[]).forEach(msg=>{let div=document.createElement('div');div.style.cssText=msg.role==='user'?"background:#bc00dd;color:white;padding:10px 14px;border-radius:14px 14px 0 14px;margin:8px 0 8px auto;max-width:80%;text-align:right":"background:#1e1b38;color:#ddd;padding:10px 14px;border-radius:14px 14px 14px 0;margin:8px auto 8px 0;max-width:80%";div.innerText=msg.text;caja.appendChild(div);});caja.scrollTop=caja.scrollHeight;}
async function enviarMensajeAOllama(){const input=document.getElementById('chat-user-message');const txt=input.value.trim();if(!txt)return;COMPANION_STORAGE.history[personajeActivoId].push({role:'user',text:txt});input.value='';refrescarHistorialPantallaChat();document.getElementById('active-chat-status').innerText='Escribiendo...';const char=COMPANION_STORAGE.characters.find(c=>c.id==personajeActivoId);const baseUrl=getBaseUrl();const modeloUsar=char.model||"qwen2.5:7b-instruct-q4_K_M";try{const res=await fetch(`${baseUrl}/api/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:modeloUsar,prompt:`${char.prompt}\nUsuario: ${txt}\nResponde como ${char.name}:`,stream:false})});if(!res.ok)throw new Error("HTTP "+res.status);const data=await res.json();COMPANION_STORAGE.history[personajeActivoId].push({role:'model',text:(data.response||"").trim()});localStorage.setItem('COMPANION_DB',JSON.stringify(COMPANION_STORAGE));refrescarHistorialPantallaChat();}catch(e){alert(`Falló: ${baseUrl} - ${e.message}\nVerifica: termux-wake-lock && ollama serve`);}finally{document.getElementById('active-chat-status').innerText=modeloUsar;}}
function formatearBaseDeDatosCompleta(){if(confirm('¿Borrar todo?')){COMPANION_STORAGE={config:{userName:"Master S",ollamaUrl:"http://127.0.0.1:11434"},characters:[],history:{}};localStorage.setItem('COMPANION_DB',JSON.stringify(COMPANION_STORAGE));location.reload();}}
</script>
</body>
</html>
