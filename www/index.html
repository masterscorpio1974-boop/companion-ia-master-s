<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COMPANION IA MASTER S</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0914;color:#fff;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.app-header{background:#131129;padding:10px;text-align:center;border-bottom:2px solid #bc00dd;z-index:10}
.main-title{font-size:20px;font-weight:900;letter-spacing:1px}
.author-tag{color:#a855f7;font-size:11px;font-weight:bold}
.live-tag{color:#22c55e;font-size:9px;background:#22c55e22;padding:2px 6px;border-radius:10px;border:1px solid #22c55e44}
.main-content{flex:1;overflow-y:auto;padding:15px;padding-bottom:80px}
.view-panel{animation:fade.2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.character-card{background:linear-gradient(135deg,#1a1636,#131129);border:1px solid #bc00dd44;border-radius:14px;padding:14px;display:flex;gap:12px;margin-bottom:12px;cursor:pointer}
.character-card:active{transform:scale(.98)}
.avatar{width:45px;height:45px;background:#bc00dd30;border:1px solid #bc00dd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.form-input,.form-textarea{width:100%;background:#1a1636;border:1.5px solid #a855f7;padding:14px;border-radius:10px;color:#fff;font-size:15px;margin-bottom:12px}
.form-textarea{height:100px;resize:none}
.btn-save{background:#bc00dd;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-weight:900;font-size:16px}
.btn-cancel{background:#2a2844;color:#fff;border:none;padding:14px;border-radius:10px;width:100%}
.modal-buttons{display:flex;gap:10px}
#chat-messages-box{display:flex;flex-direction:column;gap:8px}
.msg-user{background:#bc00dd;align-self:flex-end;padding:10px 14px;border-radius:16px 16px 2px 16px;max-width:85%}
.msg-ai{background:#1e1c3a;border:1px solid #bc00dd33;align-self:flex-start;padding:10px 14px;border-radius:16px 16px 16px 2px;max-width:85%}
.app-nav-bar{height:70px;background:#131129;border-top:2px solid #bc00dd;display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20}
.nav-item{flex:1;background:none;border:none;color:#6b6a8a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:3px}
.nav-item.active{color:#bc00dd;font-weight:900}
.nav-item span{font-size:22px}
#no-characters-fallback{text-align:center;color:#6b6a8a;margin-top:60px;line-height:1.6}
</style>
</head>
<body>
<header class="app-header">
<div class="main-title">COMPANION IA</div>
<span class="author-tag">by MASTER S</span> <span class="live-tag">● SAM:latest ONLINE</span>
</header>

<main class="main-content">
<div id="panel-home" class="view-panel">
<h3 style="margin-bottom:12px;color:#a855f7">Tus Personajes</h3>
<div id="characters-list"></div>
<div id="no-characters-fallback">👤 Sin personajes<br><small>Toca + Crear para empezar</small></div>
</div>

<div id="panel-crear" class="view-panel" style="display:none">
<h3 style="margin-bottom:12px">＋ Nuevo Personaje</h3>
<input id="char-name" class="form-input" placeholder="Nombre ej: Sam">
<textarea id="char-prompt" class="form-textarea" placeholder="Personalidad: Eres Sam, una asistente..."></textarea>
<input id="char-saludo" class="form-input" placeholder="Saludo inicial ej: Hola Master S 😘">
<div class="modal-buttons">
<button onclick="cambiarPanel('home')" class="btn-cancel">Cancelar</button>
<button onclick="guardarNuevoPersonaje()" class="btn-save">Guardar</button>
</div>
</div>

<div id="panel-chat" class="view-panel" style="display:none">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
<button onclick="cambiarPanel('home')" style="background:none;border:none;color:#bc00dd;font-size:24px">←</button>
<div><b id="active-chat-name">IA</b><br><small id="active-chat-status" style="color:#22c55e">● En linea - SAM:latest</small></div>
</div>
<div id="chat-messages-box"></div>
<div style="display:flex;gap:8px;margin-top:12px;position:sticky;bottom:0;background:#0a0914;padding-top:8px">
<input id="chat-user-message" class="form-input" style="flex:1;margin:0" placeholder="Escribe..." onkeypress="if(event.key==='Enter') enviarMensajeAOllama()">
<button onclick="enviarMensajeAOllama()" style="background:#bc00dd;border:none;color:#fff;width:50px;border-radius:10px;font-size:20px">➤</button>
</div>
</div>

<div id="panel-yo" class="view-panel" style="display:none">
<h3>MI PERFIL MASTER S</h3>
<p style="color:#a855f7;margin:10px 0">Modelo: SAM:latest (1.9GB)</p>
<p style="color:#6b6a8a;font-size:12px;margin-bottom:20px">URL: http://localhost:11434\</p\>
<button onclick="if(confirm('¿Borrar TODO?')){localStorage.clear();location.reload()}" style="background:#ff1a1a22;color:#ff4d4d;border:1px solid #ff4d4d;padding:12px;border-radius:10px;width:100%">🗑️ Borrar todo</button>
</div>
</main>

<footer class="app-nav-bar">
<button id="nav-home" class="nav-item active" onclick="cambiarPanel('home')"><span>🏠</span>Home</button>
<button id="nav-crear" class="nav-item" onclick="cambiarPanel('crear')"><span>＋</span>Crear</button>
<button id="nav-chat" class="nav-item" onclick="cambiarPanel('home')"><span>💬</span>Chats</button>
<button id="nav-yo" class="nav-item" onclick="cambiarPanel('yo')"><span>👤</span>Yo</button>
</footer>

<script>
let COMPANION_STORAGE=JSON.parse(localStorage.getItem('COMPANION_DB'))||{config:{userName:"Master S",ollamaUrl:"http://localhost:11434"},characters:[],history:{}};
let personajeActivoId=null;
document.addEventListener('DOMContentLoaded',()=>{renderizarListaPersonajes()});
function cambiarPanel(v){document.querySelectorAll('.view-panel').forEach(p=>p.style.display='none');document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));document.getElementById('panel-'+v).style.display='block';let b=document.getElementById('nav-'+v);if(b)b.classList.add('active')}
function guardarNuevoPersonaje(){let n=document.getElementById('char-name').value.trim(),p=document.getElementById('char-prompt').value.trim(),s=document.getElementById('char-saludo').value.trim();if(!n||!p){alert('Falta nombre o personalidad wey');return}let nw={id:'char_'+Date.now(),name:n,prompt:p,saludo:s||"Hola, soy "+n+" 😘"};COMPANION_STORAGE.characters.push(nw);COMPANION_STORAGE.history[nw.id]=[{role:'model',text:nw.saludo}];localStorage.setItem('COMPANION_DB',JSON.stringify(COMPANION_STORAGE));document.getElementById('char-name').value='';document.getElementById('char-prompt').value='';document.getElementById('char-saludo').value='';renderizarListaPersonajes();cambiarPanel('home')}
function renderizarListaPersonajes(){let l=document.getElementById('characters-list');l.innerHTML='';document.getElementById('no-characters-fallback').style.display=COMPANION_STORAGE.characters.length?'none':'block';COMPANION_STORAGE.characters.forEach(c=>{let d=document.createElement('div');d.className='character-card';d.innerHTML=`<div class="avatar">${c.name[0].toUpperCase()}</div><div style="flex:1"><b>${c.name}</b><br><small style="color:#a855f7">${c.prompt.slice(0,50)}...</small><br><small style="color:#22c55e">● SAM:latest</small></div>`;d.onclick=()=>abrirSalaChat(c.id);l.appendChild(d)})}
function abrirSalaChat(id){personajeActivoId=id;document.getElementById('active-chat-name').innerText=COMPANION_STORAGE.characters.find(c=>c.id===id).name;cambiarPanel('chat');refrescarHistorialPantallaChat()}
function refrescarHistorialPantallaChat(){let b=document.getElementById('chat-messages-box');b.innerHTML='';(COMPANION_STORAGE.history[personajeActivoId]||[]).forEach(m=>{let d=document.createElement('div');d.className=m.role==='user'?'msg-user':'msg-ai';d.innerText=m.text;b.appendChild(d)});b.scrollTop=b.scrollHeight}
async function enviarMensajeAOllama(){let inp=document.getElementById('chat-user-message'),txt=inp.value.trim();if(!txt||!personajeActivoId)return;COMPANION_STORAGE.history[personajeActivoId].push({role:'user',text:txt});inp.value='';refrescarHistorialPantallaChat();document.getElementById('active-chat-status').innerText='Escribiendo...';let ch=COMPANION_STORAGE.characters.find(c=>c.id===personajeActivoId);try{let r=await fetch(COMPANION_STORAGE.config.ollamaUrl+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'SAM:latest',prompt:`Instruccion: ${ch.prompt}\nUsuario: ${txt}\nResponde como ${ch.name}:`,stream:false})});let d=await r.json();COMPANION_STORAGE.history[personajeActivoId].push({role:'model',text:d.response.trim()});localStorage.setItem('COMPANION_DB',JSON.stringify(COMPANION_STORAGE));refrescarHistorialPantallaChat()}catch(e){alert('Error wey: Prende Ollama en Termux:\nexport OLLAMA_HOST=0.0.0.0:11434\nollama serve &')}finally{document.getElementById('active-chat-status').innerText='● En linea - SAM:latest'}}
</script>
</body>
</html>
