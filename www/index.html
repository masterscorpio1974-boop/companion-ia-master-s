<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COMPANION IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0c1d;color:#fff;font-family:sans-serif;overflow-x:hidden}
#app-wrapper{padding-bottom:110px;min-height:100vh}
.app-header{text-align:center;padding:25px 15px 15px;border-bottom:1px solid rgba(188,0,221,0.3)}
.neon-logo-wrapper{position:relative;width:110px;height:110px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.neon-halo{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#bc00dd,#00ccdd);box-shadow:0 0 20px #bc00dd,0 0 40px rgba(0,204,221,0.5);animation:haloGiro 4s linear infinite}
.avatar-img{position:relative;width:85px;height:85px;border-radius:50%;object-fit:cover;z-index:2}
.main-title{font-size:26px;font-weight:900}
.author-tag{color:#a855f7;font-size:11px}
.live-tag{font-size:11px;font-family:monospace;margin-top:4px;font-weight:bold}
.main-content{padding:16px}
.view-panel{display:none}.view-panel.active{display:block}
.character-card{background:#131129;border:1px solid rgba(188,0,221,0.5);padding:14px;border-radius:12px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.character-img{width:40px;height:40px;border-radius:50%}
.form-input,.form-textarea{width:100%;background:#0d0c1d;border:1px solid #a855f7;padding:12px;border-radius:8px;color:#fff;font-size:16px}
.modal-buttons{display:flex;gap:10px}.modal-buttons button{flex:1;padding:12px;border-radius:8px;font-weight:bold;border:0;outline:0}
.btn-save{background:#bc00dd;color:#fff}.btn-cancel{background:#323130;color:#fff}
#chat-messages-box{height:calc(100vh - 260px);overflow-y:auto;padding:8px;background:#0a0914;border-radius:12px;margin:10px 0}
.app-nav-bar{position:fixed;bottom:0;left:0;width:100%;height:85px;background:#131129;border-top:2px solid #bc00dd;display:flex;z-index:999}
.nav-item{flex:1;background:#131129;color:#a855f7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav-item.active{color:#bc00dd}
.img-preview{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #bc00dd;display:none;margin-bottom:10px}
@keyframes haloGiro{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app-wrapper">
<header class="app-header">
<div class="neon-logo-wrapper"><div class="neon-halo"></div><img src="icon.png" class="avatar-img" onerror="this.style.display='none'"></div>
<h1 class="main-title">COMPANION IA</h1>
<span class="author-tag">by MASTER S</span>
<p class="live-tag" id="live-status" style="color:#ff0040">• CHECANDO...</p>
</header>

<main class="main-content">
<div class="view-panel active" id="panel-home"><h2>Tus Personajes</h2><div id="characters-list"></div><div id="no-chara"></div></div>
<div class="view-panel" id="panel-chats"><h2>Tus Chats</h2><div id="chats-list"></div></div>
<div class="view-panel" id="panel-create"><h2>Nuevo Personaje</h2></div>
<div class="view-panel" id="panel-yo">
<input type="file" id="char-img-file" accept="image/*" style="display:none" onchange="previewImagen(event)">
<input type="text" id="char-name" class="form-input" placeholder="Nombre del personaje...">
<input type="text" id="char-model" class="form-input" placeholder="Modelo Ollama (ej: qwen2.5-7b-instruct-q4_K_M)">
<textarea id="char-prompt" class="form-textarea" placeholder="Prompt del personaje (rol que debe seguir)..."></textarea>
<textarea id="char-saludo" class="form-textarea" placeholder="Saludo inicial..." rows="2"></textarea>
<div class="modal-buttons"><button type="button" class="btn-save" onclick="guardarNuevoPersonaje()">💾Guardar</button><button type="button" class="btn-cancel" onclick="limpiarFormulario()">❌Limpiar</button></div>
<p style="font-size:10px;color:#666;margin-top:8px">Modelos: qwen2.5-7b-instruct-q4_K_M (factual) / dolphin-llama3:8b (creativo)</p>
</div>
<div class="view-panel" id="panel-chat">
<div style="display:flex;align-items:center;gap:10px;padding:12px;background:#131129;border-radius:12px;margin-bottom:15px">
<label style="font-size:12px;color:#a855f7">Tu Nombre:</label><input id="user-profile-name" class="form-input" style="flex:1;margin:0">
</div>
</main>

<footer class="app-nav-bar">
<button type="button" id="nav-home" class="nav-item active" onclick="cambiarPanel('home')">🏚️Home</button>
<button type="button" id="nav-chats" class="nav-item" onclick="cambiarPanel('chats')">💬Chats</button>
<button type="button" id="nav-create" class="nav-item" onclick="cambiarPanel('create')">➕Crear</button>
<button type="button" id="nav-yo" class="nav-item" onclick="cambiarPanel('yo')">👤Yo</button>
</footer>
</div>

<script>
// 🧠 ALMACENAMIENTO PRINCIPAL Y CONFIGURACIÓN
let COMPANION_STORAGE = JSON.parse(localStorage.getItem('COMPANION_DB')) || {
  config: {
    userName: "Master S",
    ollamaUrl: "http://127.0.0.1:11434/api"
  },
  characters: [],
  history: {}
};

let personajeActivoId = null;
let tempImagen64 = "";

document.addEventListener('DOMContentLoaded', () => {
  console.log("✅ DOM LISTO — INICIANDO...");
  document.getElementById('user-profile-name').value = COMPANION_STORAGE.config.userName;
  checarConexionReal();
});

// ⚙️ OBTENER URL BASE LIMPIA Y SEGURA
function getBaseUrl(){
  let url = (COMPANION_STORAGE?.config?.ollamaUrl || "").trim();
  url = url.replace(/\/api\/generate$/, "").replace(/\/+$/, "");
  console.log("🔗 URL BASE FINAL:", url);
  return url;
}

// 🟢 FUNCIÓN DE CONEXIÓN FINAL — CON LOG Y TIEMPO SUFICIENTE
async function checarConexionReal(){
  const el = document.getElementById('live-status');
  const base = getBaseUrl();
  console.log("🔍 COMPROBANDO EN:", `${base}/api/tags`);

  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000); // ⏰ 5 SEGUNDOS — MÁS SEGURO
    const res = await fetch(`${base}/api/tags`, {
      method: 'GET',
      signal: ctrl.signal
    });
    clearTimeout(t);

    console.log("📡 RESPUESTA ESTADO:", res.status, "| OK?", res.ok);

    if(res && res.ok){
      el.innerHTML = '✅ • OFFGRID • CONECTADO';
      el.style.color = '#00ff66';
      el.style.textShadow = '0 0 8px #00ff66';
      console.log("💚 CONECTADO PERFECTAMENTE A OLLAMA ✅");
    } else {
      throw new Error(`Código HTTP: ${res.status}`);
    }
  } catch (e){
    console.error("❌ ERROR CONEXIÓN:", e.message);
    el.innerHTML = '⚠️ • CONECTANDO... PRENDE/REVISA TERMUX';
    el.style.color = '#ffaa00';
    el.style.textShadow = '0 0 6px #ffaa00';
  }
}

// 🖼️ PREVISUALIZAR IMAGEN
function previewImagen(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    tempImagen64 = ev.target.result;
    const vista = document.querySelector('.img-preview');
    vista.style.display = 'block';
    vista.src = tempImagen64;
  };
  reader.readAsDataURL(file);
}

// 📂 CAMBIAR PANELES
function cambiarPanel(nombre){
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById(`panel-${nombre}`).classList.add('active');
  document.getElementById(`nav-${nombre}`).classList.add('active');
}

// 💾 GUARDAR CONFIGURACIÓN PERFIL/IP
function guardarConfig(){
  COMPANION_STORAGE.config.userName = document.getElementById('user-profile-name').value.trim();
  localStorage.setItem('COMPANION_DB', JSON.stringify(COMPANION_STORAGE));
  alert("✅ PERFIL/IP GUARDADO! VOLVIENDO A COMPROBAR...");
  checarConexionReal(); // RECOMPRUEBA INMEDIATAMENTE
}

// 🧹 LIMPIAR FORMULARIO
function limpiarFormulario(){
  document.getElementById('char-name').value = "";
  document.getElementById('char-model').value = "";
  document.getElementById('char-prompt').value = "";
  document.getElementById('char-saludo').value = "";
  tempImagen64 = "";
  document.querySelector('.img-preview').style.display = 'none';
}

// 🆕 GUARDAR PERSONAJE NUEVO
function guardarNuevoPersonaje(){
  const nombre = document.getElementById('char-name').value.trim();
  const modelo = document.getElementById('char-model').value.trim() || "qwen2.5-7b-instruct-q4_K_M";
  const prompt = document.getElementById('char-prompt').value.trim();
  const saludo = document.getElementById('char-saludo').value.trim();
  if(!nombre || !prompt) return alert("⚠️ NOMBRE Y PROMPT OBLIGATORIOS");
  const id = "p_" + Date.now();
  COMPANION_STORAGE.characters.push({id,nombre,modelo,prompt,saludo,img:tempImagen64});
  COMPANION_STORAGE.history[id] = [];
  localStorage.setItem('COMPANION_DB', JSON.stringify(COMPANION_STORAGE));
  alert("✅ PERSONAJE GUARDADO!");
  limpiarFormulario();
}

// 📄 LISTA PERSONAJES (BÁSICO)
function renderizarListaPersonajes(){
  const lista = document.getElementById('characters-list');
  if(!lista) return;
  lista.innerHTML = "";
  COMPANION_STORAGE.characters.forEach(p => {
    lista.innerHTML += `<div class="character-card"><span class="character-img" style="background:#222">👤</span><div><strong>${p.nombre}</strong><br><small>${p.modelo}</small></div></div>`;
  });
}
</script>
</body>
</html>
