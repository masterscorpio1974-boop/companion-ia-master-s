name: Build Companion IA APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install && npm install @capacitor/android @capacitor/filesystem capacitor-llama-cpp --save
      - run: mkdir -p www && cp index.html logic.js style.css icon.png www/
      - run: rm -rf android && npx cap add android
      - run: npx cap sync android
      - name: Borrar iconos default
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.xml
      - name: Inyectar Logo Morado
        run: |
          for d in android/app/src/main/res/mipmap-*; do cp icon.png $d/ic_launcher.png; cp icon.png $d/ic_launcher_round.png; done
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Companion-IA-Master-S-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
